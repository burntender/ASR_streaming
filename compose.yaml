services:
  vibevoice-asr:
    image: vibevoice-asr:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim-bookworm}
        INSTALL_TORCH: ${INSTALL_TORCH:-1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    ipc: host
    stdin_open: true
    tty: true
    working_dir: /app
    environment:
      MODEL_DIR: /models/vibevoice
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-vibevoice-asr}
      PORT: ${CONTAINER_PORT:-8080}
      HF_HOME: /cache/huggingface
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_DTYPE: ${ASR_DTYPE:-auto}
    ports:
      - "${PORT:-8080}:${CONTAINER_PORT:-8080}"
    command: ["serve"]
    volumes:
      - ${MODEL_DIR_HOST:-./models/vibeVoice}:/models/vibevoice:ro
      - ${AUDIO_DIR_HOST:-./data/audio}:/data/audio
      - ${HF_CACHE_HOST:-./cache/huggingface}:/cache/huggingface
